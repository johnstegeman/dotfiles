# Starship prompt — Ayu Dark.
#
# Layout:
#   line 1 left:  [ os ] [ path ] [ python ] [ status ]
#   line 1 right: [ vcs ]  (jj in jj repos, git otherwise — right-aligned via $fill)
#   line 2:       ❯
#
# VCS uses starship's native jj modules (starship 1.27+): one `jj show @` call per prompt,
# jj-vs-git selection by [vcs] order. There are deliberately no [custom] modules.
#
# Transience is enabled in config.fish (`enable_transience`); the transient ❯ is rendered by
# functions/starship_transient_prompt_func.fish.

palette = "catppuccin_mocha"

add_newline = true

format = "$os $directory$python$status$fill$vcs$line_break$character"

# --- Ayu Dark palette ---------------------------------------------------------
# Values match the "Ayu Dark" fish theme in fish/themes/ (yellow is Ayu's E6B450, brought over
# from the tide config that used it).
[palettes.ayu-dark]
text = "#BFBDB6"    # default foreground
comment = "#5A6673" # dimmed / secondary
orange = "#FF8F40"  # path, renames
red = "#F07178"     # errors, deletions, conflicts
yellow = "#E6B450"  # modifications
green = "#AAD94C"   # additions, python
cyan = "#39BAE6"    # bookmarks, branches, prompt character
purple = "#D2A6FF"  # jj change id (fish_color_param)

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# --- VCS ----------------------------------------------------------------------
# jj first, git otherwise. jj_modules/git_modules spell out the segment order.
[vcs]
order = ["jj", "git"]
jj_modules = "$jj_bookmark$jj_change$jj_metrics$jj_status"
git_modules = "$git_branch$git_status$git_metrics"

# Bookmark on @ (or the nearest ancestor bookmark), with @remote for remote ones.
[jj_bookmark]
format = "[$symbol$bookmark(@$remote)]($style) "
symbol = "\ue0a0 "
style = "fg:teal"
truncation_length = 32

# Change id (no commit id — see bead haven-9ay).
[jj_change]
format = "$change "
prefix_style = "fg:lavender"
suffix_style = "fg:lavender"
change_hash_length = 6

# Lines added/removed in the working-copy change.
[jj_metrics]
format = "([+$added](fg:green) )([-$deleted](fg:red) )"
only_nonzero_diffs = true

# Per-file status flags: ! conflicted, ◆ immutable, ~ modified, + added, ✘ deleted, » renamed.
# jj's "empty description" marker (◌) only exists inside $all, which has a single style, so it is not shown.
[jj_status]
format = "([$conflicted](fg:red)[$immutable](fg:comment)[$modified](fg:yellow)[$added](fg:green)[$deleted](fg:red)[$renamed](fg:peach) )"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = "\ue0a0 "
style = "fg:teal"
truncation_length = 32

[git_status]
format = "([$conflicted](fg:red))([$deleted](fg:red))([$renamed](fg:orange))([$modified](fg:yellow))([$staged](fg:green))([$untracked](fg:yellow))([$stashed](fg:yellow))([$ahead_behind](fg:cyan) )"
# ahead/behind/diverged must be spelled out: the built-in defaults for these render the arrows
# without the counts (verified: default gives "⇡", these give "⇡1").
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
conflicted = " !${count}"
deleted = " ✘${count}"
renamed = " »${count}"
modified = " ~${count}"
staged = " +${count}"
untracked = " ?${count}"

[git_metrics]
format = "([+$added](fg:green) )([-$deleted](fg:red) )"
only_nonzero_diffs = true

# --- Left side ----------------------------------------------------------------
[os]
disabled = false
format = "[$symbol]($style)"
style = "fg:text"

[os.symbols]
Macos = "\uf179" # nf-fa-apple
Linux = "\uf17c" # nf-fa-linux

[directory]
format = "[$path]($style) "
style = "fg:peach"
truncation_length = 5
truncate_to_repo = false

[python]
format = "[$symbol($version)(\\($virtualenv\\))]($style) "
style = "fg:green"
symbol = "\ue235 " # nf-md-language_python

# ✘ in Ayu red when the previous command failed; nothing on success.
[status]
disabled = false
format = "[$symbol]($style) "
symbol = "✘"
success_symbol = ""
style = "fg:red"

# --- Right alignment and character -------------------------------------------
[fill]
symbol = " "

[character]
success_symbol = "[❯](fg:teal)"
error_symbol = "[❯](fg:red)"
